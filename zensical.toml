[project]
site_name = "coregraft"
repo_url = "https://github.com/OO-LD/coregraft"
site_url = "https://OO-LD.github.io/coregraft/"
site_description = "Profiled GitHub template with full automation from commit to release"
site_author = "OO-LD Contributors"
edit_uri = "edit/main/docs/"
repo_name = "OO-LD/coregraft"
copyright = 'Maintained by <a href="https://github.com/OO-LD">OO-LD</a>.'

nav = [
    { "Home" = "index.md" },
    { "Releasing" = "releasing.md" },
]

[project.theme]
language = "en"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "content.tabs.link",
    "navigation.footer",
    "navigation.indexes",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "green"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "green"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/OO-LD/coregraft"

# Zensical REPLACES its default Markdown extensions as soon as a project declares any, so
# the defaults are restated here. scripts/check_markdown_extensions.py checks this block
# against the installed Zensical (`make check-extensions`). Add project extensions below it.
[project.markdown_extensions.abbr]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]

[project.markdown_extensions.pymdownx.caret]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.magiclink]

[project.markdown_extensions.pymdownx.mark]

[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid" }]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]

# Jinja2 macros (see macros.py): docs pages reuse the README and the version
# marker instead of duplicating them, so the two can never drift.
[project.markdown_extensions.zensical.extensions.macros]
module_name = "macros"
