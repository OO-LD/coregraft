[project]
site_name = "coregraft"
repo_url = "https://github.com/OO-LD/coregraft"
site_url = "https://OO-LD.github.io/coregraft/"
site_description = "Profiled GitHub template with full automation from commit to release"
site_author = "OO-LD Contributors"
edit_uri = "edit/main/docs/"
repo_name = "OO-LD/coregraft"
copyright = 'Maintained by <a href="https://github.com/OO-LD">OO-LD</a>.'

nav = [
    { "Home" = "index.md" },
    { "Releasing" = "releasing.md" },
]

[project.theme]
language = "en"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "content.tabs.link",
    "navigation.footer",
    "navigation.indexes",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "green"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "green"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/OO-LD/coregraft"

[project.markdown_extensions.attr_list]

[project.markdown_extensions.pymdownx.superfences]

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
name = "mermaid"
class = "mermaid"
format = "pymdownx.superfences.fence_code_format"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.toc]
permalink = true

# Jinja2 macros (see macros.py): docs pages reuse the README and the version
# marker instead of duplicating them, so the two can never drift.
[project.markdown_extensions.zensical.extensions.macros]
module_name = "macros"
