# The schema profile publishes schemas and a specification, not a package.
# uv manages only the tooling below (docs, versioning, hooks).
[project]
name = "coregraft-example"
description = "A coregraft example project"
version = "0.1.0"
requires-python = ">=3.10,<4.0"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mike @ git+https://github.com/squidfunk/mike.git@2.2.0+zensical-0.1.0",
    "pre-commit>=4.0.0",
    "python-semantic-release>=10.0.0",
    "zensical>=0.0.46",
]

[tool.semantic_release]
commit_parser = "conventional"
tag_format = "v{version}"
commit_message = "chore(release): v{version} [skip ci]"
allow_zero_version = true
build_command = "uv lock"
version_toml = ["pyproject.toml:project.version"]
# >>> citation
version_variables = ["CITATION.cff:version"]
# <<< citation
exclude_commit_patterns = ['''chore\(release\):.*''']
assets = ["uv.lock"]

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

# Applies to the tooling scripts (scripts/*.py); keep in step with the other
# profiles so a script moved between repositories formats identically.
[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "YTT", "S", "B", "A", "C4", "T10", "SIM", "I", "C90", "E", "W", "F",
    "PGH", "UP", "RUF", "TRY",
]
ignore = ["E501", "E731", "TRY003"]

[tool.ruff.format]
preview = true
