[project]
name = "coregraft-example"
description = "A coregraft example project"
authors = [{ name = "coregraft-owner" }]
readme = "README.md"
keywords = ["python"]
requires-python = ">=3.10,<4.0"
# Version is managed by python-semantic-release (see [tool.semantic_release]).
# Do not edit by hand; it is bumped automatically on merge to main.
version = "0.1.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://coregraft-owner.github.io/coregraft-example/"
Documentation = "https://coregraft-owner.github.io/coregraft-example/"
Repository = "https://github.com/coregraft-owner/coregraft-example"

[dependency-groups]
dev = [
    "deptry>=0.25.0",
    "mike @ git+https://github.com/squidfunk/mike.git@2.2.0+zensical-0.1.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    # >>> benchmarks
    "pytest-benchmark>=5.0.0",
    # <<< benchmarks
    "python-semantic-release>=10.0.0",
    "ty>=0.0.1a21",
    "zensical>=0.0.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coregraft_example"]

[tool.semantic_release]
commit_parser = "conventional"
tag_format = "v{version}"
commit_message = "chore(release): v{version} [skip ci]"
allow_zero_version = true
build_command = "uv lock"
version_toml = ["pyproject.toml:project.version"]
# >>> citation
version_variables = ["CITATION.cff:version"]
# <<< citation
exclude_commit_patterns = ['''chore\(release\):.*''']
assets = ["uv.lock"]

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-config=pyproject.toml --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
skip_empty = true

[tool.deptry]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "YTT", "S", "B", "A", "C4", "T10", "SIM", "I", "C90", "E", "W", "F",
    "PGH", "UP", "RUF", "TRY",
]
ignore = ["E501", "E731", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true
