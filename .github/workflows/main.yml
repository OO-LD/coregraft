# CI for the template repository itself: lint the configuration and run the
# template integrity tests. Profile self-test jobs (generate each profile,
# then run its own check/test suite) join this workflow when the profiles
# land; the docs check joins when the docs do.
name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

  tests:
    runs-on: ubuntu-latest
    strategy:
      # The bounds of requires-python; the full OS x Python matrix belongs to
      # the python profile, not to the template's own integrity tests.
      matrix:
        python-version: ["3.10", "3.14"]
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the template integrity tests
        run: make test

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Check if documentation can be built
        run: make docs-test

  # The self-test gate: generate every profile through the button path
  # (full copy + make init) and run the generated repository's own check
  # suite. A red profile blocks the merge, so no broken core ever reaches a
  # grafted repository through an update.
  version-preview:
    # Show contributors what a merge would release, based on the conventional
    # commits on the branch. Pull requests only; informational.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # PSR needs full history + tags to compute the bump
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Compute release preview
        id: preview
        run: |
          # PSR only computes a release on the main branch; name the checked-out
          # PR head 'main' so the preview reflects what a merge would release.
          git checkout -B main >/dev/null 2>&1 || true
          current=$(uv version --short 2>/dev/null || echo "unknown")
          next=$(uv run semantic-release version --print 2>/dev/null || echo "")
          if [ -n "$next" ] && [ "$next" != "$current" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          # Stamp the upcoming changelog section locally (no commit/tag/push/build)
          # so the preview shows the notes this merge would add.
          if [ -n "$next" ] && [ "$next" != "$current" ]; then
            uv run semantic-release version --no-commit --no-tag --no-push --no-vcs-release --skip-build >/dev/null 2>&1 || true
          fi
          {
            echo "changelog<<PSR_EOF"
            git --no-pager diff HEAD -- CHANGELOG.md | awk '/^\+/ && !/^\+\+\+/ {sub(/^\+/,""); print}' | head -80
            echo "PSR_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post release preview comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: version-preview
          message: |
            ## Release preview

            ${{ steps.preview.outputs.released == 'true' && format('Merging this PR would release **v{0}** (current: `v{1}`).', steps.preview.outputs.next, steps.preview.outputs.current) || format('No version bump from the current commits (stays at `v{0}`). Use conventional commit types (`feat`, `fix`, ...) to trigger a release.', steps.preview.outputs.current) }}

            <details><summary>Changelog preview (truncated)</summary>

            ```markdown
            ${{ steps.preview.outputs.changelog }}
            ```

            </details>

            <sub>Preview via python-semantic-release and conventional commits.</sub>

  test-profiles:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [python, schema]
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      # The schema profile validates with ajv under Node; harmless for others.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate an instance (button path)
        run: |
          instance="$RUNNER_TEMP/instance"
          rsync -a --exclude .git --exclude .venv --exclude site ./ "$instance/"
          cd "$instance"
          uv run scripts/init.py --defaults \
            --data profile=${{ matrix.profile }} \
            --data project_name=selftest-repo \
            --data owner=selftest-org \
            --data description="Profile self-test"
          git init -q && git add -A   # pre-commit and uv need a git work tree

      - name: Run the instance's own checks
        run: |
          cd "$RUNNER_TEMP/instance"
          make install
          make check
          make test
          make docs-test

      # The instance must also pass the link check it ships with, otherwise
      # every generated repository starts red on its first push.
      - name: Check the instance's Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config "$RUNNER_TEMP/instance/lychee.toml" --no-progress
            --exclude-path node_modules --exclude-path site
            "$RUNNER_TEMP/instance/**/*.md"
          fail: true
          failIfEmpty: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
